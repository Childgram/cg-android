apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

def childgramDev = project.hasProperty('childgramDev')
def childgram = childgramDev || project.hasProperty('childgram')
def childgramRelease = childgram && !childgramDev
def childgramSigningPassword = ''
if (childgramRelease) {
    if (APP_PACKAGE != 'org.childgram') {
        throw new GradleException('The Childgram release application ID must be org.childgram.')
    }
    def keyFile = rootProject.file('.local/signing/childgram-release.p12')
    def passwordFile = rootProject.file('.local/signing/password.txt')
    if (!keyFile.isFile() || !passwordFile.isFile()) {
        throw new GradleException('Release signing key is missing. Restore .local/signing from backup, or run ./dev/signing-key --create for the first release only.')
    }
    childgramSigningPassword = passwordFile.text.trim()
    if (childgramSigningPassword.length() < 16) {
        throw new GradleException('The release signing password file is empty or invalid.')
    }
}

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile childgramDev ? rootProject.file('.local/debug.keystore') : file("../TMessagesProj/config/release.keystore")
            storePassword childgramDev ? 'android' : RELEASE_STORE_PASSWORD
            keyAlias childgramDev ? 'androiddebugkey' : RELEASE_KEY_ALIAS
            keyPassword childgramDev ? 'android' : RELEASE_KEY_PASSWORD
        }

        release {
            storeFile childgramRelease ? rootProject.file('.local/signing/childgram-release.p12') : file("../TMessagesProj/config/release.keystore")
            storePassword childgramRelease ? childgramSigningPassword : RELEASE_STORE_PASSWORD
            keyAlias childgramRelease ? 'childgram' : RELEASE_KEY_ALIAS
            keyPassword childgramRelease ? childgramSigningPassword : RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                if (childgram) {
                    abiFilters 'arm64-v8a'
                } else {
                    abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                }
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(childgramRelease ? CHILDGRAM_VERSION_CODE : APP_VERSION_CODE)

    if (childgram) {
        def mapsKeyFile = rootProject.file('.local/google-maps-api-key.txt')
        def mapsApiKey = mapsKeyFile.isFile() ? mapsKeyFile.text.trim() : ''
        if (!(mapsApiKey ==~ /AIza[0-9A-Za-z_-]{35}/)) {
            throw new GradleException('Childgram requires a Maps SDK for Android key in .local/google-maps-api-key.txt. Restrict it to the application package and signing certificate; see dev/README.md.')
        }
        def childgramVariant = childgramDev ? 'afatDebug' : 'afatRelease'
        def childgramType = childgramDev ? buildTypes.debug : buildTypes.release
        sourceSets.maybeCreate(childgramVariant).manifest.srcFile rootProject.file('dev/AndroidManifest.xml')
        sourceSets.getByName(childgramVariant).res.srcDir rootProject.file('dev/res')
        childgramType.resValue 'string', 'AppName', childgramDev ? 'Childgram Dev' : 'Childgram'
        childgramType.resValue 'string', 'AppNameBeta', childgramDev ? 'Childgram Dev' : 'Childgram'
        childgramType.resValue 'string', 'childgram_account_type', APP_PACKAGE + (childgramDev ? '.beta' : '')
        childgramType.manifestPlaceholders.childgramPushEnabled = (!rootProject.childgramFirebase.isEmpty()).toString()
        childgramType.manifestPlaceholders.childgramMapsApiKey = mapsApiKey
        rootProject.childgramFirebase.each { name, value ->
            childgramType.resValue 'string', name, value
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = childgramRelease ? defaultConfig.versionCode : defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName childgramRelease ? CHILDGRAM_VERSION_NAME : APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

if (!childgram) {
    apply plugin: 'com.google.gms.google-services'
}
