name: Publish Android update feed

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/update-feed.yml', 'dev/release.py', 'dev/tests/test_release.py']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feed-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Childgram/cg-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select the highest published version code, including prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s dev/tests -p 'test_release.py' -v
          python3 dev/release.py feed --output .local/update-site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .local/update-site
      - name: Deploy update.childgram.org
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
