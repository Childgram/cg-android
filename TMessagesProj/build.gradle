import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

def childgramDev = project.hasProperty('childgramDev')
def childgram = childgramDev || project.hasProperty('childgram')
def telegramApiId = '0'
def telegramApiHash = ''
if (childgram) {
    if (!childgramDev && project.hasProperty('childgramSmoke')) {
        throw new GradleException('Childgram release builds cannot use smoke credentials.')
    }
    def credentials = new Properties()
    def credentialsFile = rootProject.file('.local/telegram.properties')
    if (credentialsFile.exists()) {
        credentialsFile.withInputStream { credentials.load(it) }
    }
    telegramApiId = credentials.getProperty('TELEGRAM_API_ID', '').trim()
    telegramApiHash = credentials.getProperty('TELEGRAM_API_HASH', '').trim()
    if (!telegramApiId && !telegramApiHash && project.hasProperty('childgramSmoke')) {
        // Telegram permits its published sample credentials for local testing only.
        telegramApiId = '4'
        telegramApiHash = '014b35b6184100b085b0d0572f9b5103'
        logger.warn('Childgram smoke build: using Telegram public sample credentials for local testing only. Do not distribute this APK.')
    } else if (!telegramApiId.isInteger() || telegramApiId.toInteger() <= 0 || !(telegramApiHash ==~ /[0-9a-fA-F]{32}/)) {
        throw new GradleException('Set TELEGRAM_API_ID and TELEGRAM_API_HASH in .local/telegram.properties (see dev/telegram.properties.example). Obtain your keys at https://my.telegram.org/apps. For a local launch check only, explicitly add -PchildgramSmoke.')
    }
    telegramApiId = telegramApiId.toInteger().toString()
    if (!childgramDev && (telegramApiId == '4' || telegramApiHash == '014b35b6184100b085b0d0572f9b5103')) {
        throw new GradleException('Childgram release builds require your own Telegram API credentials.')
    }
}

