android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        buildConfigField 'boolean', 'CHILDGRAM_DEV', childgramDev.toString()
        buildConfigField 'boolean', 'CHILDGRAM', childgram.toString()
        buildConfigField 'int', 'TELEGRAM_API_ID', telegramApiId
        buildConfigField 'String', 'TELEGRAM_API_HASH', '"' + telegramApiHash + '"'
        buildConfigField 'String', 'CHILDGRAM_APPLICATION_ID', '"' + APP_PACKAGE + '"'

        if (childgram) {
            ndk.abiFilters 'arm64-v8a'
        }

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                if (childgram) {
                    arguments '-DCMAKE_JOB_POOLS=childgram_compile=4;childgram_link=1', '-DCMAKE_JOB_POOL_COMPILE=childgram_compile', '-DCMAKE_JOB_POOL_LINK=childgram_link'
                    if (project.hasProperty('childgramCompilerCache')) {
                        arguments '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
                    }
                }
                targets 'tmessages.49'
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'CHILDGRAM_APPLICATION_ID', '"' + APP_PACKAGE + '.beta"'
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", (!childgramDev).toString()
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
